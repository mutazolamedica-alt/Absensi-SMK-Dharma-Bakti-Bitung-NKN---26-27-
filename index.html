<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ABSENKU SMK</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>ABSENKU SMK</h1>

        <p>Sistem Absensi QR Code</p>

    </div>

    <!-- JAM -->

    <div class="card waktu">

        <div id="tanggal">

            Memuat tanggal...

        </div>

        <div id="jam">

            00:00:00

        </div>

    </div>

    <!-- MODE -->

    <div class="card">

        <h2>MODE ABSENSI</h2>

        <div id="modeText" class="mode-belum">

            BELUM DIPILIH

        </div>

        <button
            id="btnMode"
            class="btn biru">

            PILIH MODE MASUK

        </button>

    </div>

    <!-- KAMERA -->

    <div class="card">

        <div id="reader"></div>

    </div>

    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
        style="display:none;">

        Memproses...

    </div>

    <!-- HASIL -->

    <div
        id="hasilBox"
        class="card">

        <h2>

            HASIL SCAN

        </h2>

        <div id="hasil">

            Belum ada scan.

        </div>

    </div>

</div>

<!-- ============================ -->
<!-- Library Scanner -->
<!-- ============================ -->

<script src="https://unpkg.com/html5-qrcode"></script>

<!-- ============================ -->
<!-- Javascript -->
<!-- ============================ -->

<script src="script.js"></script>

<script src="scanner.js"></script>

<script src="api.js"></script>

</body>

</html>
